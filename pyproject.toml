[project]
name = "analisis-brecha-laboral-colombia"
version = "0.1.0"
description = "Pipeline ETL y analítica de datos end-to-end sobre la brecha laboral y empleabilidad en Colombia"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alejandro Cristancho" }
]

dependencies = [
    "httpx>=0.28.0",
    "selectolax>=0.3.27",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pandera>=0.22.0",
    "duckdb>=1.1.3",
    "pyarrow>=18.1.0",
    "pandas>=2.2.3",
    "polars>=1.17.0",
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",
    "streamlit>=1.41.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

